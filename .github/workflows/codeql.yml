name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Run every Monday at midnight
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:${{matrix.language}}"

      - name: Generate CodeQL Security Report
        uses: rsdmike/github-security-report-action@a3d8cc051bc89f1b622d396adab901aa73857a29 # v4.1.0
        with:
          template: report
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CodeQL Security Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-report-${{ matrix.language }}
          path: report.pdf

  analyze_rust:
    name: Analyze (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clippy
        run: rustup component add clippy

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # 1.26.2

      - name: Install dependencies
        run: cargo binstall --no-confirm clippy-sarif sarif-fmt

      - name: Run clippy
        working-directory: rust
        run: |
          cargo clippy --all-features --message-format=json > clippy.json
          sed --in-place 's/"file_name":"itt/"file_name":"rust\/itt/g' clippy.json
          clippy-sarif --input clippy.json --output clippy.sarif
        continue-on-error: true

      - name: Print SARIF
        run: sarif-fmt --input rust/clippy.sarif

      - name: Upload analysis
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: rust/clippy.sarif
          wait-for-processing: true

  analyze_bandit:
    name: Analyze (Bandit Scan)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Install dependencies
        run: pip install sarif-tools

      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f # v1.0.1
        continue-on-error: true
        with:
          targets: "python"

      - name: Convert SARIF report to HTML
        run: sarif html --output bandit-report.html results.sarif

      - name: Upload Bandit Scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.html
